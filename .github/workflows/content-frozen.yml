name: Content frozen — author in the Bazaar

# claude-config is now a generated downstream mirror of Traba-Ops/bazaar.
# Content changes land there and arrive here automatically via the mirror
# workflow, which pushes straight to main using CLAUDE_CONFIG_PUSH_TOKEN — a
# token whose actor bypasses the "Require PR to main" ruleset (Platform team
# member or explicit bypass actor) — so mirror pushes never trip this check.
#
# Runs on every PR (no paths filter) so it can safely be made a required
# status check: a paths-filtered workflow that gets skipped never reports a
# status, which would leave non-content PRs hanging on "Expected". Instead
# the job always runs, diffs against the base, and fails only when frozen
# content paths changed.

on:
  pull_request:

jobs:
  reject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if frozen content paths changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- skills/ rules/ hooks/)"
          if [ -n "$changed" ]; then
            echo "Frozen content paths changed in this PR:"
            echo "$changed"
            echo "::error::claude-config content is frozen. This repo is a generated mirror of Traba-Ops/bazaar — land your change there (data/traba, data/teams/<team>, or data/people/<you>) and the mirror will bring it here automatically. See Traba-Ops/bazaar/docs/mirroring.md."
            exit 1
          fi
          echo "No frozen content paths touched — check passes."
